name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every check the tag has to pass is the CI workflow, run as is rather than copied.
  ci:
    uses: ./.github/workflows/ci.yml

  # Compares the tagged API against the last release, so a breaking change that skipped the
  # version bump it needs fails before anything reaches crates.io.
  semver:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  publish:
    name: Publish
    needs: [ci, semver]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
